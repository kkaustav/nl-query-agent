<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🥕🎵 NL Query Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      background: #1e293b;
      padding: 16px 24px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 1.4rem; color: #38bdf8; }
    header p  { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
    #chat-container {
      flex: 1;
      width: 100%;
      max-width: 800px;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .user {
      background: #0ea5e9;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .agent {
      background: #1e293b;
      color: #e2e8f0;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #334155;
    }
    .thinking {
      color: #64748b;
      font-style: italic;
      font-size: 0.85rem;
    }
    #input-area {
      width: 100%;
      max-width: 800px;
      padding: 16px;
      display: flex;
      gap: 10px;
    }
    #question {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
    }
    #question:focus { border-color: #0ea5e9; }
    #send-btn {
      padding: 12px 24px;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    #send-btn:disabled { background: #334155; cursor: not-allowed; }
    #send-btn:hover:not(:disabled) { background: #0284c7; }
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 16px;
      max-width: 800px;
      width: 100%;
    }
    .chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .chip:hover { border-color: #0ea5e9; color: #0ea5e9; }
  </style>
</head>
<body>
  <header>
    <h1>🥕🎵 NL Query Agent</h1>
    <p>Ask questions about Farmers Market & Spotify data in plain English</p>
  </header>

  <div id="chat-container"></div>

  <div class="examples">
    <span class="chip" onclick="ask(this)">Top 5 markets in California</span>
    <span class="chip" onclick="ask(this)">Average Spotify track duration</span>
    <span class="chip" onclick="ask(this)">How many farmers markets accept credit cards?</span>
    <span class="chip" onclick="ask(this)">Most popular music genres</span>
    <span class="chip" onclick="ask(this)">Markets open on weekends in New York</span>
  </div>

  <div id="input-area">
    <input id="question" type="text" placeholder="Ask anything about your data..." onkeydown="if(event.key==='Enter') sendQuery()" />
    <button id="send-btn" onclick="sendQuery()">Send ➤</button>
  </div>

  <script>
    const chat = document.getElementById('chat-container');
    const input = document.getElementById('question');
    const btn   = document.getElementById('send-btn');

    function ask(chip) {
      input.value = chip.textContent;
      sendQuery();
    }

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendQuery() {
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, 'user');
      input.value = '';
      btn.disabled = true;

      const thinking = addMessage('⏳ Thinking...', 'agent thinking');

      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let agentDiv = null;
        let fullText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n').filter(l => l.startsWith('data: '));

          for (const line of lines) {
            const data = JSON.parse(line.replace('data: ', ''));
            fullText += data.text;

            if (!agentDiv) {
              thinking.remove();
              agentDiv = addMessage(fullText, 'agent');
            } else {
              agentDiv.textContent = fullText;
              chat.scrollTop = chat.scrollHeight;
            }
          }
        }
      } catch (err) {
        thinking.remove();
        addMessage('❌ Error: ' + err.message, 'agent');
      }

      btn.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
