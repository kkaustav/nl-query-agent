<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NL Query Agent</title>
  <style>
    :root { --bg:#0f1117; --panel:#171a24; --panel-2:#1d2130; --text:#f2f4f8; --muted:#a6afc3; --accent:#8b5cf6; --border:#2a3042; --border-soft:#3a4158; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#161a27 0%,var(--bg) 55%);color:var(--text);height:100vh;overflow:hidden}
    .app{display:grid;grid-template-columns:320px 1fr;height:100vh}.sidebar{background:linear-gradient(180deg,#121521 0%,#10131b 100%);border-right:1px solid var(--border);padding:18px 16px;overflow-y:auto}
    .title{font-size:18px;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:10px;color:#d7dcff}.section-title{color:#aab2c8;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:18px 0 12px}
    .upload-card{border:2px dashed #3a4158;border-radius:18px;padding:22px 16px;text-align:center;background:rgba(255,255,255,.02);cursor:pointer}.upload-icon{font-size:34px;margin-bottom:10px;display:block}.upload-text{color:var(--muted);font-size:14px;line-height:1.4}
    .input{width:100%;margin-top:14px;border-radius:10px;border:1px solid var(--border-soft);background:#10131b;color:var(--text);padding:12px 14px;font-size:15px;outline:none}.button{width:100%;margin-top:14px;border:none;border-radius:12px;padding:13px 14px;background:linear-gradient(180deg,#9b7bf7 0%,#7f5af0 100%);color:white;font-size:16px;font-weight:700;cursor:pointer}.button:disabled{opacity:.6;cursor:not-allowed}
    .status-box{margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.03);white-space:pre-wrap;min-height:48px;color:#d7dcff}.status-box.ok{color:#8bf0b0;border-color:rgba(139,240,176,.35)}.status-box.error{color:#ff8f8f;border-color:rgba(255,143,143,.35)}
    .history{margin-top:14px;max-height:calc(100vh - 360px);overflow-y:auto;padding-right:4px}.history-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;color:#d7dcff;cursor:pointer}.history-item small{display:block;color:var(--muted);margin-top:6px;font-size:12px}
    .main{display:flex;flex-direction:column;height:100vh;overflow:hidden}.header{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(10,12,18,.55);backdrop-filter:blur(12px)}.brand{font-weight:800;color:#dfe4ff}.chat{flex:1;overflow-y:auto;padding:22px}
    .message{max-width:860px;margin-bottom:14px;padding:16px 18px;border-radius:16px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}.user{margin-left:auto;background:linear-gradient(180deg,#8b5cf6 0%,#6d28d9 100%);color:white}.assistant{background:var(--panel-2);border:1px solid var(--border);color:#e9ecf4}
    .composer{border-top:1px solid var(--border);padding:16px 18px;background:rgba(10,12,18,.6);backdrop-filter:blur(12px)}.composer-row{display:flex;gap:12px;align-items:center}.chat-input{flex:1;border:1px solid var(--border-soft);background:#10131b;color:var(--text);border-radius:14px;padding:14px 16px;font-size:15px;outline:none}.send-btn{border:none;border-radius:14px;padding:14px 18px;background:linear-gradient(180deg,#9b7bf7 0%,#7f5af0 100%);color:white;font-weight:800;cursor:pointer;min-width:98px}.send-btn:disabled{opacity:.65;cursor:not-allowed}.hidden{display:none}.file-name{margin-top:10px;color:#d7dcff;font-size:13px;word-break:break-word}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="title">🤖 NL Query Agent</div>
      <div class="section-title">Upload Dataset</div>
      <div class="upload-card" id="uploadCard"><span class="upload-icon">📁</span><div class="upload-text">Click to upload<br>CSV · Parquet · JSON</div><input id="fileInput" class="hidden" type="file" accept=".csv,.parquet,.json" /></div>
      <div class="file-name" id="fileName"></div>
      <input id="datasetName" class="input" type="text" placeholder="dataset name to upload" />
      <button id="uploadBtn" class="button">Upload & Register</button>
      <div class="section-title">Delete Dataset</div>
      <input id="deleteDatasetName" class="input" type="text" placeholder="dataset name to delete" />
      <button id="deleteBtn" class="button" style="background:linear-gradient(180deg,#f97373 0%,#dc2626 100%);">Delete Dataset</button>
      <div id="actionStatus" class="status-box">Ready.</div>
      <div class="section-title">Query History</div>
      <div id="historyList" class="history"></div>
    </aside>
    <main class="main"><div class="header"><div class="brand">NL Query Agent</div></div><div id="chat" class="chat"></div><div class="composer"><div class="composer-row"><input id="queryInput" class="chat-input" type="text" placeholder="Ask a question..." /><button id="sendBtn" class="send-btn">Send ➤</button></div></div></main>
  </div>
  <script>
    const sessionId = localStorage.getItem("session_id") || `sess_${Math.random().toString(36).slice(2,12)}`; localStorage.setItem("session_id", sessionId);
    const uploadCard=document.getElementById('uploadCard'), fileInput=document.getElementById('fileInput'), fileName=document.getElementById('fileName'), datasetName=document.getElementById('datasetName'), uploadBtn=document.getElementById('uploadBtn'), actionStatus=document.getElementById('actionStatus'), deleteDatasetName=document.getElementById('deleteDatasetName'), deleteBtn=document.getElementById('deleteBtn'), historyList=document.getElementById('historyList'), chat=document.getElementById('chat'), queryInput=document.getElementById('queryInput'), sendBtn=document.getElementById('sendBtn');
    let selectedFile=null;
    uploadCard.addEventListener('click',()=>fileInput.click());
    fileInput.addEventListener('change',()=>{selectedFile=fileInput.files[0]||null; fileName.textContent=selectedFile?selectedFile.name:''});
    function setStatus(text, kind='ok'){actionStatus.className=`status-box ${kind}`; actionStatus.textContent=text}
    async function refreshHistory(){try{const res=await fetch(`/history?session_id=${encodeURIComponent(sessionId)}`,{cache:'no-store'}); const data=await res.json(); historyList.innerHTML=''; (data||[]).slice().reverse().forEach(item=>{const div=document.createElement('div'); div.className='history-item'; div.textContent=item.q; const small=document.createElement('small'); small.textContent=item.ts||''; div.appendChild(small); historyList.appendChild(div);});}catch(e){}}
    async function fetchDatasets(){const res=await fetch(`/datasets?ts=${Date.now()}`,{cache:'no-store'}); if(!res.ok) throw new Error(`datasets endpoint failed (${res.status})`); return await res.json()}
    function formatDatasets(prefix, datasets){return `${prefix} Current datasets: ${datasets.join(', ') || 'none'}.`}
    function addMessage(text, role){const div=document.createElement('div'); div.className=`message ${role}`; div.textContent=text; chat.appendChild(div); chat.scrollTop=chat.scrollHeight; return div}
    async function uploadDataset(){if(!selectedFile){setStatus('Please choose a file first.','error'); return} const name=datasetName.value.trim(); if(!name){setStatus('Please enter a dataset name.','error'); return} const formData=new FormData(); formData.append('file',selectedFile); formData.append('dataset_name',name); uploadBtn.disabled=true; try{const res=await fetch('/upload',{method:'POST',body:formData}); const data=await res.json().catch(()=>({})); if(!res.ok) throw new Error(data.error||data.detail||`Upload failed (${res.status})`); const datasets=data.datasets||await fetchDatasets(); setStatus(formatDatasets('Uploaded.',datasets),'ok'); await refreshHistory();}catch(e){setStatus(`Upload failed. ${e.message}`,'error')}finally{uploadBtn.disabled=false}}
    async function deleteDataset(){const name=deleteDatasetName.value.trim(); if(!name){setStatus('Please enter a dataset name to delete.','error'); return} deleteBtn.disabled=true; try{const formData=new FormData(); formData.append('dataset_name',name); const res=await fetch('/delete',{method:'POST',body:formData}); const data=await res.json().catch(()=>({})); if(!res.ok) throw new Error(data.error||data.detail||`Delete failed (${res.status})`); const datasets=data.datasets||await fetchDatasets(); setStatus(formatDatasets('Deleted.',datasets),'ok'); await refreshHistory();}catch(e){setStatus(`Delete failed. ${e.message}`,'error')}finally{deleteBtn.disabled=false}}
    uploadBtn.addEventListener('click',uploadDataset); deleteBtn.addEventListener('click',deleteDataset);
    async function sendQuery(){const question=queryInput.value.trim(); if(!question) return; addMessage(question,'user'); queryInput.value=''; sendBtn.disabled=true; const assistantBubble=addMessage('...','assistant'); try{const res=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,session_id:sessionId})}); const data=await res.json(); if(!res.ok) throw new Error(data.text||`Query failed (${res.status})`); assistantBubble.textContent=data.text||'No response received.';}catch(e){assistantBubble.textContent=`Error: ${e.message}`;}finally{sendBtn.disabled=false; refreshHistory()}}
    sendBtn.addEventListener('click',sendQuery); queryInput.addEventListener('keydown',(e)=>{if(e.key==='Enter') sendQuery()});
  </script>
</body>
</html>
